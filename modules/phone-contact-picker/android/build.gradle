// Same shape as `create-expo-module --local` for SDK 54 (see modules/app-minimizer).
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.phonecontactpicker'
version = '0.1.0'

android {
  namespace "expo.modules.phonecontactpicker"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
